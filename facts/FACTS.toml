[prayer-fix-low-hp-feel-better]
claim = "A successful prayer can print 'You feel better.'"
tag = "unverified"
web = ["https://nethackwiki.com/wiki/Prayer"]
notes = "Not printed by pray.c in 5.0 (grep: only 'You feel much better.' at pray.c:425); in 5.0 'You feel better.' comes from artifact.c:1788 (artifact invoke healing), not prayer. The wiki Prayer page (3.6.6) gives no HP-fix message. The marker is harmless (a substring of no failure line) but may misread a non-prayer message as success."

