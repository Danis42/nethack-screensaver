[prayer-boon-spellbook-at-feet]
claim = "A pleased god can give a spellbook, printed as '<A spellbook> appears at your feet!' via at_your_feet()"
tag = "5.0-source"
evidence = ["reference/nethack-5.0.0/src/pray.c:1063", "reference/nethack-5.0.0/src/pray.c:788-800"]
quote = "at_your_feet(upstart(ansimpleoname(otmp)));"
web = []
notes = "The text names the book's appearance (e.g. 'A dusty spellbook'), so 'A spellbook appears at your feet!' matches only some books; levitating heroes get 'beneath', blind heroes 'Something lands'."

