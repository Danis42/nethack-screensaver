[cloned-monsters-drop-no-items]
claim = "Cloned monsters (mcloned, e.g. split puddings) never drop a random death item, and big cloned monsters lose the guaranteed corpse"
tag = "5.0-source"
evidence = ["reference/nethack-5.0.0/src/mon.c:3588-3594", "reference/nethack-5.0.0/src/mon.c:3244-3245"]
quote = "/* no items from cloned monsters */ && !mtmp->mcloned) {"
web = []
notes = "So pudding farming for items does not work in 5.0. Corpses of clones are still possible by the ordinary random corpse chance (mon.c:3247-3248), so sacrifice farming is not ruled out by this code alone."

[hellfill-has-seven-styles]
