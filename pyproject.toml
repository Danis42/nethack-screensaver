[project]
name = "nethack-screensaver"
version = "0.2.0"
description = "Terminal screensaver: AutoAscend plays NetHack"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nle",
    "numpy>=2.0",
    "numba>=0.61",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "toolz>=1.0",
]

[project.scripts]
screens-bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", {include-group = "bench"}]
bench = ["mcp>=2.3"]

[tool.uv.sources]
# NetHack 5.0: NLE has no release for it. The NLE fork (branch screens-nh5) lives in a local bare repo
# under ~/git (no remote, D-01) and is pinned by commit; uv.lock records the commit and every bench job
# records it (D-02).
nle = { path = "vendor/nle" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoascend", "nethack_screensaver", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: plays real games (minutes)"]
addopts = "-m 'not slow'"
filterwarnings = ["error:overflow encountered:RuntimeWarning"]
